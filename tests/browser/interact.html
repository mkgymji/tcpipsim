<!doctype html>
<meta charset="utf-8">
<title>tcpipsim: test ovládání v prohlížeči</title>
<!-- Spouští tests/run_all.sh (headless Chromium, --dump-dom). Načte simulátor v iframe,
     projde ovládání a výsledek zapíše do #result (data-result="OK" | "FAIL"). -->
<pre id="result" data-result="RUNNING">běží</pre>
<iframe id="f" src="../../index.html#k=8b&m=tcpip" width="1280" height="720"></iframe>
<script>
const log = [];
let failed = 0;
const check = (ok, what) => { log.push(`${ok ? 'ok  ' : 'FAIL'} ${what}`); if (!ok) failed++; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');
// „U“ (rozhodnutí 38): spodní hrana bloku ve středu = spodní hrana aktivní vrstvy (±8 px)
const rect = (el) => el?.getBoundingClientRect();
function liftCheck(d, what) {
  const fl = rect(d.querySelector('#nest .float'));
  const act = rect(d.querySelector('.stack .row.active'));
  const l1 = rect(d.querySelector('#stack-sender .row:last-child'));
  check(fl && act && Math.abs(fl.bottom - act.bottom) <= 8 && fl.bottom <= l1.top + 2,
    `${what}: blok končí u aktivní vrstvy (blok ${Math.round(fl?.bottom)}, vrstva ${Math.round(act?.bottom)}, L1 od ${Math.round(l1?.top)})`);
}

// Odkazové čipy (rozhodnutí 56c): v krocích `ks` je aspoň jeden čip, každý má aria-label, najetí
// zvýrazní cíl a cíl existuje (pole rentgenu se po kliku vybere, terminál se otevře).
async function chipCheck(fr, lvl, ks) {
  for (const k of ks) {
    fr.contentWindow.location.hash = `#u=${lvl}&k=${k}&m=osi`;
    await wait(200);
    const d = fr.contentDocument, w = fr.contentWindow;
    const n = d.querySelectorAll('#explain .tchip').length;
    check(n > 0, `úroveň ${lvl}, krok ${k}: v textu je odkazový čip (${n})`);
    for (let i = 0; i < n; i++) {
      const c = d.querySelectorAll('#explain .tchip')[i];
      const kind = c.dataset.chip, t = c.dataset.chipTarget, what = `úroveň ${lvl}, krok ${k}, čip ${kind}:${t}`;
      check(c.getAttribute('aria-label')?.length > 3 && c.textContent.trim().startsWith('→'), `${what}: „→ …“ s aria-label`);
      c.dispatchEvent(new w.MouseEvent('mouseover', { bubbles: true }));
      check(d.querySelectorAll('.chip-hl').length > 0, `${what}: najetí zvýrazní cíl`);
      c.dispatchEvent(new w.MouseEvent('mouseout', { bubbles: true }));
      check(!d.querySelector('.chip-hl'), `${what}: odjetí zvýraznění zruší`);
      if (kind === 'rentgen' && /^[a-z]+\.[a-z_]+$/.test(t)) {
        c.click();
        check(d.querySelector(`#info tr.selected[data-field="${t}"]`), `${what}: klik vybere pole v rentgenu`);
      } else if (kind === 'rentgen') {
        check(d.querySelector(`#info [data-target="${t}"]`), `${what}: karta v pravém panelu existuje`);
      } else if (kind === 'topo') {
        check(d.querySelector(`.left .topo [data-target="${t}"], .left .topo [data-node="${t}"]`), `${what}: prvek topologie existuje`);
      } else {
        c.click();
        check(!d.getElementById('termwin').hidden, `${what}: klik otevře terminál`);
        d.getElementById('term-input')?.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      }
    }
  }
}

// 720p: popisky se nepřekrývají (štítek uzlu × štítek sítě, ARP × brána, karty PC, řádek L4,
// role sloupce × „Teď Bob“ a její zkrácení). Měří getBoundingClientRect, iframe je 1280×720.
const overlap = (a, b) => { const x = rect(a), y = rect(b); return Math.min(x.right, y.right) - Math.max(x.left, y.left) > 1 && Math.min(x.bottom, y.bottom) - Math.max(x.top, y.top) > 1; };
function layoutCheck(d, what) {
  const bad = [];
  for (const p of d.querySelectorAll('.pc3 > .pill')) for (const nl of d.querySelectorAll('.netlab')) if (overlap(p, nl)) bad.push(`štítek „${p.textContent}“ × síť`);
  for (const c of d.querySelectorAll('.pc3')) {
    const a = c.querySelector('.arp3 .al'), g = c.querySelector('.gw');
    if (a && g && overlap(a, g)) bad.push(`ARP × brána (${c.className})`);
  }
  const cards = [...d.querySelectorAll('.pc3')], lg = d.querySelector('.t3 + .legend');
  cards.forEach((a, i) => { cards.slice(i + 1).forEach((b) => { if (overlap(a, b)) bad.push('karty PC se překrývají'); }); if (lg && overlap(a, lg)) bad.push('karta PC × legenda'); });
  for (const row of d.querySelectorAll('.row[data-layer="L4"], .row[data-layer="transport"]')) {
    const nm = row.querySelector('.l1 > span'), pdu = row.querySelector('.pdu'), sk = row.querySelector('.skipmark');
    if (nm && pdu && rect(pdu).width && (overlap(nm, pdu) || rect(pdu).bottom > rect(row).bottom + 1)) bad.push('řádek L4: název × PDU / přetéká');
    if (sk && rect(sk).width && [nm, pdu].some((x) => x && rect(x).width && overlap(x, sk))) bad.push('řádek L4: „bez portů“ × název');
  }
  for (const id of ['sender-role', 'receiver-role']) {
    const r = d.getElementById(id);
    if (r.scrollWidth > r.clientWidth + 1) bad.push(`${id} zkrácená (${r.scrollWidth} > ${r.clientWidth})`);
  }
  const now = d.getElementById('receiver-now');
  if (now && !now.hidden && overlap(d.getElementById('receiver-role'), now)) bad.push('role × Teď Bob');
  check(!bad.length, `${what} (1280×720): popisky bez překryvů${bad.length ? `: ${bad.join('; ')}` : ''}`);
}

f.onload = async () => {
  f.onload = null;     // přepnutí úrovně iframe načte znovu, test běží jen jednou
  try {
    await wait(300);
    const d = f.contentDocument, w = f.contentWindow, root = d.documentElement;
    const $ = (s) => d.querySelector(s);
    const key = (k, target = d.body) => target.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true }));
    const label = () => $('#prog-label').textContent;
    const playText = () => $('#btn-play').textContent;
    const infoTitle = () => $('#info h3')?.textContent ?? '';

    check(root.dataset.step === '9' && root.dataset.model === 'tcpip', `adresa #k=8b&m=tcpip otevře krok 8b v TCP/IP (${label()})`);
    check(label().startsWith('Krok 8b z 10'), 'popisek kroku 8b');
    check($('#term').hidden, 'terminál je na úrovni 1 skrytý');
    check(infoTitle() === 'Detail', `prázdný panel se jmenuje Detail (${infoTitle()})`);

    // kritický nález: vrstva v panelu + přepnutí modelu
    $('#stack-sender [data-layer="transport"]').click();
    check(infoTitle().startsWith('Co dělá L4'), `klik na vrstvu (${infoTitle()})`);
    key('t');
    check(root.dataset.model === 'osi' && infoTitle().startsWith('Co dělá L4'), `T přepne model a panel zůstane (${infoTitle()})`);
    $('#stack-sender [data-layer="L6"]').click();
    key('t');
    check(infoTitle().startsWith('Co dělá L5-7'), `L6 -> aplikační vrstva TCP/IP (${infoTitle()})`);
    check(!root.dataset.errors, 'bez chyby po přepnutí modelu');

    // obálka: tlačítko je štítek
    check(!d.querySelector('#nest [role="button"]'), 'žádné role=button v obálkách');
    $('#nest button.lab[data-env="udp"]').click();
    check(infoTitle().startsWith('Obálka'), `klik na štítek obálky (${infoTitle()})`);

    // adresa se aktualizuje při krokování
    key('ArrowRight');
    await wait(50);
    check(w.location.hash === '#k=8c&m=tcpip', `krok vpřed přepíše adresu (${w.location.hash})`);
    w.location.hash = '#k=4&m=osi';
    await wait(200);
    check(root.dataset.step === '4' && root.dataset.model === 'osi', `změna adresy (hashchange) přepne krok i model (${label()})`);
    check(label().includes('Obálka linkové vrstvy'), `titul kroku 4 v ISO/OSI (${label()})`);
    liftCheck(d, 'úroveň 1, krok 4 (L2 Alice)');
    w.location.hash = '#k=8b&m=osi';
    await wait(200);
    liftCheck(d, 'úroveň 1, krok 8b (L3 Bob)');
    w.location.hash = '#k=6&m=osi';
    await wait(200);
    {
      const rib = rect(d.querySelector('#medium .mrow.on .ribbon'));
      const l1s = rect(d.querySelector('#stack-sender .row:last-child')), l1r = rect(d.querySelector('#stack-receiver .row:last-child'));
      check(rib && rib.top >= l1s.top - 2 && rib.bottom <= l1s.bottom + 2 && rib.left >= l1s.right - 2 && rib.right <= l1r.left + 2,
        `úroveň 1, krok 6: bity jedou v pruhu média mezi řádky L1 (bity ${[rib?.left, rib?.right, rib?.top, rib?.bottom].map(Math.round)}, L1 ${[l1s.right, l1r.left, l1s.top, l1s.bottom].map(Math.round)})`);
      check(d.querySelector('#wire.act') && d.querySelector('#wire-cap').textContent.includes('L1'), 'kabel v topologii zvýrazněný s odkazem na L1');
      // kontrola 38, M4: klik na kabel nahoře i na kabel v pruhu dole otevře stejný detail „Kabel“
      $('#wire').click();
      await wait(50);
      const top = infoTitle() === 'Kabel' ? $('#info').innerHTML : null;
      $('#stack-sender .row:last-child').click();
      await wait(50);
      check(infoTitle() !== 'Kabel', `mezitím jiný detail (${infoTitle()})`);
      const cab = rect(d.querySelector('#medium .mrow .cable'));
      let hit = null;
      for (let x = cab.left + 4; x < cab.right - 4 && !hit; x += 6) {
        const el = d.elementFromPoint(x, cab.top + cab.height / 2);
        if (el?.matches?.('.cable.hit')) hit = el;
      }
      hit?.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
      await wait(50);
      check(top && hit && infoTitle() === 'Kabel' && $('#info').innerHTML === top,
        `klik na kabel nahoře i v pruhu dole otevře stejný detail (nahoře ${Boolean(top)}, v pruhu ${Boolean(hit)}, panel ${infoTitle()})`);
    }
    w.location.hash = '#k=4&m=osi';
    await wait(200);

    // posuvník: šipky projdou i 8a-8c (hodnota = pořadí kroku)
    const sl = $('#slider');
    check(sl.max === '12', `posuvník má 13 poloh (max ${sl.max})`);
    sl.value = '10'; sl.dispatchEvent(new w.Event('input', { bubbles: true }));
    check(label().startsWith('Krok 8c'), `posuvník na 8c (${label()})`);

    // mezerník na zaměřeném tlačítku nepřehrává
    const row = $('#stack-sender .row');
    row.focus();
    key(' ', row);
    check(playText().includes('Přehrát'), 'mezerník na tlačítku vrstvy nespustí přehrávání');
    key(' ');
    check(playText().includes('Pauza'), 'mezerník mimo tlačítko spustí přehrávání');
    key(' ');
    check(playText().includes('Přehrát') && d.body.classList.contains('frozen'), 'pauza zmrazí animaci');
    key(' ');
    $('#btn-questions').click();
    check($('#questions').open && playText().includes('Přehrát'), 'otevření otázek přehrávání zastaví');
    $('#questions').close();

    // omezit animace
    $('#btn-motion').click();
    check(d.body.classList.contains('reduce-motion') && $('#btn-motion').getAttribute('aria-pressed') === 'true', 'přepínač Omezit animace');
    $('#btn-motion').click();

    check(!root.dataset.errors, `stránka bez chyb (${root.dataset.lastError ?? ''})`);
    check(d.title === 'Obálky · TCP/IP výukový simulátor', `title úrovně 1 (${d.title})`);
    check($('.lvlseg [data-level="1"]').getAttribute('aria-pressed') === 'true', 'výběr úrovně ukazuje 1');

    // ---- úroveň 2: přepnutí výběrem v záhlaví (stránka se načte znovu) ----
    const loaded = () => new Promise((r) => f.addEventListener('load', r, { once: true }));
    let wait2 = loaded();
    $('.lvlseg [data-level="2"]').click();
    await wait2; await wait(300);
    let d2 = f.contentDocument, w2 = f.contentWindow, r2 = d2.documentElement;
    check(r2.dataset.level === '2' && r2.dataset.core === 'ok', `výběr úrovně 2 načte úroveň 2 (${w2.location.hash})`);
    check(d2.title === 'Adresy · TCP/IP výukový simulátor', `title úrovně 2 (${d2.title})`);
    wait2 = loaded();
    w2.location.hash = '#u=2&k=11&m=osi';
    await Promise.race([wait2, wait(400)]); await wait(200);
    d2 = f.contentDocument; w2 = f.contentWindow; r2 = d2.documentElement;
    const q = (s) => d2.querySelector(s);
    const lab2 = () => q('#prog-label').textContent;
    const key2 = (k, t = d2.body) => t.dispatchEvent(new w2.KeyboardEvent('keydown', { key: k, bubbles: true }));
    check(lab2().startsWith('Krok 11 z 18'), `adresa #u=2&k=11 (${lab2()})`);
    {
      // rámec ve switchi sedí na věžičce switche, jejíž řádek L2 svítí
      const fl = rect(q('#nest .float')), tw = rect(q('#medium .tower.switch'));
      check(fl && tw && fl.bottom <= tw.top + 2 && tw.top - fl.bottom < 20 && q('#medium .tower .tcell.active b')?.textContent === 'L2',
        `úroveň 2, krok 11: rámec nad switchem v L2 (blok ${Math.round(fl?.bottom)}, switch od ${Math.round(tw?.top)})`);
      check(!q('#medium .ribbon'), 'krok tipu: v pruhu média žádné bity');
    }
    check(q('.mact tbody').querySelectorAll('tr.new').length === 1, 'nový řádek MAC tabulky v kroku 11');
    check(q('#explain h3').textContent.startsWith('Otázka: '), `nadpis tipu (${q('#explain h3').textContent})`);
    check(!q('.port.out') && !q('.pill.received') && !q('.pill.dropped'), 'krok tipu nic neprozrazuje');
    check(!q('#termwin') || q('#termwin').hidden, 'terminál je zavřený');
    {
      // rozhodnutí 56: ohnisko tipu = žlutá karta s rámečkem a štítkem, ostatní panely ztlumené (ne pod 0.8)
      const ex = q('#explain'), cs = w2.getComputedStyle(ex);
      check(r2.dataset.stepFocus === 'tip' && ex.hasAttribute('data-focus') && ex.classList.contains('tip'), `krok tipu: ohnisko tip (${r2.dataset.stepFocus})`);
      check(cs.backgroundColor === 'rgb(255, 226, 138)' && parseFloat(cs.outlineWidth) >= 4, `karta tipu žlutá s rámečkem (${cs.backgroundColor}, ${cs.outlineWidth})`);
      check(w2.getComputedStyle(q('#explain > .stepno'), '::after').content.includes('Sleduj tady'), 'štítek Sleduj tady v záhlaví tipu');
      check(q('#explain > .stepno').getBoundingClientRect().height <= 34, `záhlaví karty na jeden řádek (${Math.round(q('#explain > .stepno').getBoundingClientRect().height)} px)`);
      const op = +w2.getComputedStyle(q('.left .topo')).opacity;
      check(op >= 0.8 && op < 1 && +w2.getComputedStyle(q('#info')).opacity < 1, `ostatní panely mírně ztlumené (${op})`);
      check(ex.scrollWidth <= ex.clientWidth + 1, 'karta tipu nepřetéká do šířky');
    }
    // předpověď: klik na port, Potvrdit tip, vyhodnocení
    q('.port[data-pick="Fa0/2"]').click();
    check(q('.port[data-pick="Fa0/2"]').getAttribute('aria-pressed') === 'true', 'klik na port = tip');
    check(q('#fwd-label').textContent === 'Potvrdit tip', `Vpřed se jmenuje Potvrdit tip (${q('#fwd-label').textContent})`);
    q('#btn-fwd').click();
    await wait(50);
    check(lab2().startsWith('Krok 12'), `potvrzení tipu = krok 12 (${lab2()})`);
    check([...d2.querySelectorAll('.evalline')].some((x) => x.textContent.includes('Tvůj tip: Fa0/2. Skutečnost: Fa0/2 i Fa0/3. Nesedí: Bobovu MAC')), 'vyhodnocení tipu s důvodem');
    check(q('.port.tip.out')?.textContent.includes('Fa0/2'), 'krok vyhodnocení: port s tipem má štítek tip');
    check(w2.location.hash === '#u=2&k=12&m=osi', `adresa nese úroveň (${w2.location.hash})`);
    // krok vzad vrátí tabulku
    key2('ArrowLeft'); key2('ArrowLeft');
    check(q('.mact tbody tr.empty') !== null, `krok 10: prázdná MAC tabulka (${lab2()})`);
    key2('ArrowRight'); key2('ArrowRight');
    const mt13 = q('.mact tbody').querySelectorAll('tr').length;
    // přehrávání se na tipu zastaví (krok 13 = tip, rozhodnutí 31)
    key2(' ');
    await wait(4600);
    check(lab2().startsWith('Krok 13') && q('#btn-play').textContent.includes('Přehrát'), `přehrávání zastavilo na tipu (${lab2()})`);
    // „U“ na úrovni 2: rámec u L2 Alice, paket u L3 Boba, bity v úseku za hubem nezasahují do L1 Boba
    for (const [hash, what] of [['#u=2&k=4&m=osi', 'krok 4 (L2 Alice)'], ['#u=2&k=8b&m=osi', 'krok 8b (L3 Bob)']]) {
      w2.location.hash = hash;
      await wait(200);
      liftCheck(d2, `úroveň 2, ${what}`);
    }
    w2.location.hash = '#u=2&k=6&m=osi';
    await wait(200);
    {
      const rib = rect(q('#medium .ribbon')), l1r = rect(q('#stack-receiver .row:last-child')), tw = rect(q('#medium .tower.hub'));
      check(rib && tw && rib.left >= tw.right - 2 && rib.right <= l1r.left + 2, `úroveň 2, krok 6: bity za hubem se vejdou před L1 Boba (${Math.round(rib?.right)} ≤ ${Math.round(l1r?.left)})`);
    }
    // dvojice ve výtahu: klik na Cyrila (krok 7, rámec u příjemců)
    w2.location.hash = '#u=2&k=7&m=osi';
    await wait(200);
    q('.pcbtn[data-node="PC3"]').click();
    check(q('#receiver-name').textContent === 'Cyril', 'klik na Cyrila přepne příjemce ve výtahu');
    check(q('.pc.slot-rbot').classList.contains('pair'), 'Cyril má dvojitý obrys');
    // ruční volba příjemce platí jen v kroku, kde se kliklo (Michal: po kliknutí na Cyrila se dál „rozbalovalo“ u Cyrila)
    q('#btn-fwd').click();
    await wait(200);
    check(q('#receiver-name').textContent === 'Bob', `krok 8 po kliknutí na Cyrila v kroku 7 ukazuje Boba (${q('#receiver-name').textContent})`);
    w2.location.hash = '#u=2&k=7&m=osi';
    await wait(200);
    q('.pcbtn[data-node="PC3"]').click();
    // rentgen: buňka štítku a klávesy čísel polí (i dvouciferné, i při zaměřeném posuvníku)
    q('#nest .acell[data-field="eth.src"]')?.click();
    check(q('#info tr.selected')?.dataset.field === 'eth.src', 'klik na buňku štítku vybere pole v rentgenu');
    check(q('#nest .acell.selected')?.dataset.field === 'eth.src', 'buňka štítku má obrys vybraného pole');
    key2('1');
    check(q('#info tr.selected')?.dataset.field === 'eth.dst', 'klávesa 1 = pole 1');
    const sl2 = q('#slider');
    sl2.focus();
    key2('r', sl2);
    check(q('#info .xtab.on')?.dataset.xtab === 'ipv4', 'R přepne záložku rentgenu i na zaměřeném posuvníku');
    key2('1', sl2); key2('2', sl2);
    check(q('#info tr.selected')?.dataset.field === 'ip.src', `klávesy 1 a 2 = pole 12 (${q('#info tr.selected')?.dataset.field})`);
    const row4 = q('#info tr[data-field="ip.ttl"]') ?? q('#info tr[data-field="ip.dst"]');
    row4.focus();
    key2('Enter', row4);
    check(q('#info tr.selected')?.dataset.field === row4.dataset.field, 'Enter na řádku rentgenu vybere pole');
    key2('Escape');
    // terminál switche (krok 12, jeden naučený záznam)
    w2.location.hash = '#u=2&k=12&m=osi';
    await wait(200);
    check(mt13 === 1, `krok 12: jeden řádek MAC tabulky (${mt13})`);
    q('.devhead[data-node="SW1"]').click();
    q('[data-term="SW1"]').click();
    check(!q('#termwin').hidden && q('#termwin').classList.contains('ios'), 'terminál switche (Cisco IOS)');
    await wait(20);
    check(q('#termwin').hasAttribute('data-focus') || r2.dataset.stepFocus !== 'terminal', `otevřený terminál převezme ohnisko vrstev (${r2.dataset.stepFocus})`);
    const inp = q('#term-input');
    inp.value = 'sh mac add';
    inp.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    check(q('#term-body').textContent.includes('Total Mac Addresses for this criterion: 1'), 'show mac address-table v terminálu');
    check(lab2().startsWith('Krok 12'), `psaní v terminálu nekrokuje (${lab2()})`);
    q('#term-input').dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check(q('#termwin').hidden, 'Esc zavře terminál');
    // Spustit za mě (krok 1, ipconfig /all na Alici)
    w2.location.hash = '#u=2&k=1&m=osi';
    await wait(200);
    q('[data-run="PC1"]').click();
    check(q('#term-body').textContent.includes('02-00-00-00-00-01'), 'Spustit za mě: ipconfig /all');
    // Obnovit: výpisy terminálu pryč, historie příkazů (šipka nahoru) zůstává
    q('#btn-reset').click();
    w2.location.hash = '#u=2&k=1&m=osi';
    await wait(200);
    q('.pcbtn[data-node="PC1"]').click();
    q('[data-term="PC1"]').click();
    check(!q('#term-body').textContent.includes('02-00-00-00-00-01'), 'Obnovit smaže výpisy terminálu');
    const inp2 = q('#term-input');
    inp2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }));
    check(q('#term-input').value === 'ipconfig /all', `historie příkazů zůstala (${q('#term-input').value})`);
    // rozhodnutí 56c: odkazové čipy; 720p: rozvržení i se štítkem „Teď Bob“ (krok 8 po zahození u Cyrila)
    await chipCheck(f, 2, ['4', '11', '15']);
    for (const k of ['2', '7', '13', '8']) { w2.location.hash = `#u=2&k=${k}&m=osi`; await wait(200); layoutCheck(d2, `úroveň 2, krok ${k}`); }
    check(!q('#receiver-now').hidden, `krok 8: štítek „${q('#receiver-now').textContent}“ je vidět (měřeno i s ním)`);
    check(!r2.dataset.errors, `úroveň 2 bez chyb (${r2.dataset.lastError ?? ''})`);

    // ---- úroveň 3: výběr v záhlaví, tip, části A–D, Oprav bránu, terminál Windows a IOS ----
    let wait3 = loaded();
    q('.lvlseg [data-level="3"]').click();
    await wait3; await wait(300);
    const d3 = f.contentDocument, w3 = f.contentWindow, r3 = d3.documentElement;
    const q3 = (s) => d3.querySelector(s);
    const key3 = (k, t = d3.body) => t.dispatchEvent(new w3.KeyboardEvent('keydown', { key: k, bubbles: true }));
    const lab3 = () => q3('#prog-label').textContent;
    check(r3.dataset.level === '3' && r3.dataset.core === 'ok', `výběr úrovně 3 načte úroveň 3 (${w3.location.hash})`);
    check(d3.title === 'Směrování · TCP/IP výukový simulátor', `title úrovně 3 (${d3.title})`);
    check(lab3().startsWith('Krok 0 z 25'), `úroveň 3 má kroky 0–25 (${lab3()})`);
    // tip v kroku 5 (ARP): nic neprozradí, Vpřed = Potvrdit tip, vyhodnocení v kroku 6
    w3.location.hash = '#u=3&k=5&m=osi';
    await wait(250);
    check(q3('#explain h3').textContent.startsWith('Otázka:'), 'krok 5: nadpis Otázka');
    check(r3.dataset.stepFocus === 'tip' && q3('#explain').hasAttribute('data-focus'), 'krok 5: ohnisko tip');
    check(q3('#explain > .stephead').getBoundingClientRect().height <= 36, `krok 5: záhlaví s částmi A–D na jeden řádek (${Math.round(q3('#explain > .stephead').getBoundingClientRect().height)} px)`);
    check(!q3('.sw3 .decision'), 'tip: switch ještě nerozhodl');
    q3('#explain [data-pick="Cyril"]').click();
    q3('#explain [data-pick="R1 (Gi0/0)"]').click();
    check(q3('#fwd-label').textContent === 'Potvrdit tip', `Vpřed = Potvrdit tip (${q3('#fwd-label').textContent})`);
    key3('ArrowRight');
    await wait(250);
    check(lab3().startsWith('Krok 6 z 25') && q3('#explain .evalline')?.textContent.includes('Sedí'), `krok 6 vyhodnotí tip (${q3('#explain .evalline')?.textContent})`);
    // věž routeru v pruhu média do L3 (rozhodnutí 48)
    w3.location.hash = '#u=3&k=9&m=osi';
    await wait(250);
    check(r3.dataset.stepFocus === 'rentgen' && q3('#info').hasAttribute('data-focus') && q3('#info > h3').textContent.startsWith('Rentgen'), `krok 9 (pole rentgenu): ohnisko rentgen (${r3.dataset.stepFocus})`);
    check(q3('.tower3.router .tcell.active') && q3('.tower3.router').textContent.includes('Síťová'), 'krok 9: R1 v pruhu média, aktivní L3');
    const fl3 = rect(q3('#nest .float')), tw3 = rect(q3('.tower3.router'));
    check(fl3 && tw3 && fl3.bottom <= tw3.top + 4, `blok sedí na věži routeru (${Math.round(fl3?.bottom)} <= ${Math.round(tw3?.top)})`);
    check(q3('.rt3 tr.hit')?.textContent.includes('192.168.2.0/24'), 'směrovací tabulka R1: vybraný řádek');
    // skok na začátek části C
    d3.querySelectorAll('[data-part]')[2].click();
    await wait(150);
    check(lab3().startsWith('Krok 18 z 25'), `část C začíná krokem 18 (${lab3()})`);
    // část D (rozhodnutí 51): tip bez tlačítka opravy a bez brány v topologii, oprava až po vyhodnocení
    w3.location.hash = '#u=3&k=22a&m=osi';
    await wait(250);
    check(!q3('[data-fix]') && !q3('.pc3.a-PC1 .gw'), 'krok 22a: žádné Oprav bránu, brána Alice skrytá');
    q3('#explain [data-pick="brána"]').click();
    key3('ArrowRight');
    await wait(250);
    check(lab3().startsWith('Krok 22b') && q3('#explain .evalline')?.textContent.includes('Sedí'), `22b vyhodnotí tip (${lab3()})`);
    check(q3('#fwd-label').textContent === 'Oprav bránu', `Vpřed = Oprav bránu (${q3('#fwd-label').textContent})`);
    q3('[data-fix]').click();
    await wait(250);
    check(lab3().startsWith('Krok 22c') && q3('.pc3.a-PC1 .gw').textContent.includes('192.168.1.1'), `Oprav bránu nastaví bránu (${lab3()})`);
    // rozhodnutí 52: u odesílatele blok sedí u aktivní vrstvy
    w3.location.hash = '#u=3&k=3&m=osi';
    await wait(250);
    liftCheck(d3, 'úroveň 3 krok 3 (Alice L3)');
    // terminál Windows: živý ping se doplňuje krokováním
    w3.location.hash = '#u=3&k=3&m=osi';
    await wait(250);
    q3('[data-run="PC1"]').click();
    check(q3('#term-body').textContent.includes('Pinging 192.168.2.20') && !q3('#term-body').textContent.includes('Reply from'), 'krok 3: ping běží, odpověď ještě není');
    w3.location.hash = '#u=3&k=14&m=osi';
    await wait(250);
    check((q3('#term-body').textContent.match(/TTL=127/g) ?? []).length === 4, 'krok 14: 4× Reply TTL=127 ve stejném výpisu');
    key3('Escape', q3('#term-input'));
    // IOS: R1>, enable, show ip route, traceroute odmítnut
    q3('[data-node="R1"]').click();
    q3('[data-term="R1"]').click();
    const inp3 = q3('#term-input');
    check(q3('#termwin .prompt:last-of-type')?.textContent === 'R1>', 'konzole R1 začíná v R1>');
    inp3.value = 'enable'; inp3.dispatchEvent(new w3.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    const inp4 = q3('#term-input');
    inp4.value = 'traceroute 192.168.2.20'; inp4.dispatchEvent(new w3.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    check(q3('#term-body').textContent.includes('R1#traceroute') && q3('#term-body').textContent.includes('tracert na PC'), 'enable -> R1#, traceroute odmítnut');
    key3('Escape', q3('#term-input'));
    await chipCheck(f, 3, ['2', '9', '12', '13', '14', '15', '17', '19']);
    for (const m of ['osi', 'tcpip']) for (const k of ['3', '7', '9', '17', '25']) { w3.location.hash = `#u=3&k=${k}&m=${m}`; await wait(200); layoutCheck(d3, `úroveň 3, krok ${k}, ${m}`); }
    check(!r3.dataset.errors, `úroveň 3 bez chyb (${r3.dataset.lastError ?? ''})`);

    // ---------- úroveň 4 „Transport a aplikace“ (ui.md kap. 14) ----------
    const wait4 = loaded();
    q3('.lvlseg [data-level="4"]').click();
    await wait4; await wait(400);
    const d4 = f.contentDocument, w4 = f.contentWindow, r4 = d4.documentElement;
    const q4 = (s) => d4.querySelector(s);
    const lab4 = () => q4('#prog-label').textContent;
    check(r4.dataset.level === '4' && r4.dataset.core === 'ok', 'výběr úrovně 4 načte úroveň 4');
    check(d4.title === 'Transport a aplikace · TCP/IP výukový simulátor', `title úrovně 4 (${d4.title})`);
    check(d4.querySelectorAll('.t4 [data-node]').length >= 6 && q4('.t4 [data-node="SRV1"]') && q4('.t4 [data-node="SW2"]'), 'topologie má SW2 a SRV1');
    // obálka L4: příznaky a relativní čísla; karta Spojení se stavy obou stran
    w4.location.hash = '#u=4&k=8&m=osi';
    await wait(300);
    check(lab4().startsWith('Krok 8 z 31'), `adresa #u=4&k=8 (${lab4()})`);
    check(q4('#nest .b4 .flags4')?.textContent === 'SYN, ACK' && q4('#nest .b4').textContent.includes('ack 1'), 'obálka L4: SYN, ACK a ack 1');
    check(q4('#info .conn4') && q4('#info .conn4').textContent.includes('ESTABLISHED') && q4('#info .conn4').textContent.includes('SYN_RECEIVED'), 'karta Spojení: stavy obou stran');
    check(q4('#info tr.selected[data-field="tcp.ack"]'), 'rentgen TCP: vybrané pole ack');
    // karta Spojení se vejde do šířky panelu (žádná vodorovná přetečení tabulek)
    const over = [...d4.querySelectorAll('#info .ct4')].filter((t) => t.scrollWidth > t.parentElement.clientWidth + 1);
    check(!over.length, `tabulky karet se vejdou (${over.map((t) => `${t.scrollWidth}>${t.parentElement.clientWidth} ${[...t.querySelectorAll('td')].filter((c) => c.scrollWidth > c.clientWidth + 1).map((c) => c.textContent).join('|')}`).join('; ')})`);
    // tip 13: odpověď (ack 250) nikde na obrazovce
    w4.location.hash = '#u=4&k=13&m=osi';
    await wait(300);
    check(q4('#fwd-label').textContent !== 'Potvrdit tip' && !q4('#nest').textContent.includes('250') && !q4('#explain').textContent.includes('ack 250'), 'tip 13 neprozradí ack 250');
    q4('#explain [data-pick="250"]').click();
    await wait(100);
    check(q4('#fwd-label').textContent === 'Potvrdit tip', 'výběr tipu: Vpřed = Potvrdit tip');
    q4('#btn-fwd').click();
    await wait(300);
    check(lab4().startsWith('Krok 14') && q4('#explain .evalline')?.textContent.includes('Sedí'), `krok 14 vyhodnotí tip (${lab4()})`);
    // karta tipu (student, 720p): volby celé, bez posuvníku; otázka jen jednou; tlačítka částí A–F se vejdou
    for (const k of ['2', '6', '19', '23', '28']) {
      w4.location.hash = `#u=4&k=${k}&m=osi`;
      await wait(250);
      const ex = q4('#explain'), btns = [...d4.querySelectorAll('#explain .predict .btn')];
      const cut = btns.filter((b) => rect(b).bottom > rect(ex).bottom + 1 || rect(b).right > rect(ex).right + 1 || rect(b).bottom > w4.innerHeight);
      check(btns.length && !cut.length && ex.scrollHeight <= ex.clientHeight + 1 && ex.scrollWidth <= ex.clientWidth + 1, `tip ${k}: volby vidět bez posunu (${cut.length} useknuto)`);
      check((ex.textContent.match(/Otázka:/g) ?? []).length === 1, `tip ${k}: „Otázka:“ jen jednou`);
      const pb = [...d4.querySelectorAll('#explain .pbtn')].filter((b) => rect(b).right > rect(ex).right - 1);
      check(!pb.length, `tip ${k}: tlačítka částí se vejdou`);
    }
    // terminál: netstat -an na Alici, ss -tuln na SRV1 (Linux), ztráta v kroku 27
    w4.location.hash = '#u=4&k=10&m=osi';
    await wait(300);
    q4('[data-run="PC1"]').click();
    check(q4('#term-body').textContent.includes('ESTABLISHED'), 'krok 10: netstat -an ukáže ESTABLISHED');
    q4('#term-input').dispatchEvent(new w4.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    w4.location.hash = '#u=4&k=1&m=osi';
    await wait(300);
    q4('[data-run="SRV1"]').click();
    check(q4('#termwin.linux') && q4('#term-body').textContent.includes('LISTEN') && q4('#termwin .prompt')?.textContent === 'student@srv1:~$', 'SRV1: Linux, ss -tuln');
    q4('#term-input').dispatchEvent(new w4.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    w4.location.hash = '#u=4&k=27&m=osi';
    await wait(300);
    check(q4('.t4 .ftag3.lost'), 'krok 27: kabel ukazuje ztracený segment');
    w4.location.hash = '#u=4&k=31a&m=osi';
    await wait(300);
    check(q4('.t4 .ftag3.lost'), 'krok 31a: ztracený DNS dotaz má křížek na kabelu');
    w4.location.hash = '#u=4&k=3&m=osi';
    await wait(300);
    check(d4.querySelectorAll('.t4 .ftag3').length === 1, `krok 3: v topologii jen aktuální úsek (${d4.querySelectorAll('.t4 .ftag3').length})`);
    for (const m of ['osi', 'tcpip']) for (const k of ['3', '7', '12', '18', '22a', '24', '29']) { w4.location.hash = `#u=4&k=${k}&m=${m}`; await wait(200); layoutCheck(d4, `úroveň 4, krok ${k}, ${m}`); }
    // topologie: IP adresy v kartách se vejdou (nejsou useknuté)
    const cut = [...d4.querySelectorAll('.t4 .ip, .t4 .if3 .mono')].filter((x) => x.scrollWidth > x.clientWidth + 1 || rect(x).right > rect(x.closest('.pc3, .if3')).right + 1);
    check(!cut.length, `topologie 4: IP adresy se vejdou (${cut.length})`);
    check(!r4.dataset.errors, `úroveň 4 bez chyb (${r4.dataset.lastError ?? ''})`);

    // ---------- modelové situace (úlohy, ui.md kap. 15): dialog IPv4, kabel, Zkontrolovat ----------
    check(q4('#tmenu-list a[href="#uloha=4"]'), 'menu Úlohy obsahuje úlohu 4');
    let waitT = loaded();
    w4.location.hash = '#uloha=4';
    await waitT; await wait(400);
    let dt = f.contentDocument, wt = f.contentWindow;
    let qt = (s) => dt.querySelector(s);
    const typeT = (line) => { const i = qt('#term-input'); i.value = line; i.dispatchEvent(new wt.KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); };
    check(dt.documentElement.dataset.core === 'ok' && dt.title.startsWith('Úloha 4'), `úloha 4: režim úloh (${dt.title})`);
    qt('#t-check').click();
    check(qt('.tres.fail') && /DHCP/.test(qt('.tres').textContent), 'úloha 4: výchozí stav nefunguje (APIPA)');
    typeT('ipconfig');
    check(/Autoconfiguration IPv4 Address/.test(qt('#term-body').textContent), 'úloha 4: ipconfig ukáže APIPA');
    qt('[data-act="ipv4"]').click();
    const dlg = dt.getElementById('tdlg');
    check(dlg.open && dlg.querySelector('#f-ip').disabled, 'dialog IPv4 otevřen, pole zašedlá (DHCP)');
    dlg.querySelector('input[name=mode][value=static]').click();
    const fill = (id, v) => { const el = dlg.querySelector(id); el.value = v; el.dispatchEvent(new wt.FocusEvent('focusout', { bubbles: true })); };
    fill('#f-ip', '192.168.1.300');
    qt('#dlg-ok').click();
    check(dlg.open && /300/.test(qt('#dlg-msg').textContent), 'dialog: oktet 300 odmítne');
    fill('#f-ip', '192.168.1.10');
    dlg.querySelector('#f-mask').value = '';
    fill('#f-ip', '192.168.1.10');
    check(dlg.querySelector('#f-mask').value === '255.255.255.0', 'dialog: maska předvyplněná podle třídy');
    fill('#f-gw', '192.168.2.1'); fill('#f-dns1', '192.168.2.10');
    qt('#dlg-ok').click();
    check(dlg.open && qt('#dlg-yes'), 'dialog: brána mimo síť = varování Ano / Ne');
    qt('#dlg-no').click();
    fill('#f-gw', '192.168.1.1');
    qt('#dlg-ok').click();
    check(!dlg.open, 'dialog: správné hodnoty uloží');
    typeT('ipconfig /all');
    check(/IPv4 Address[ .]+: 192\.168\.1\.10/.test(qt('#term-body').textContent), 'úloha 4: ipconfig /all ukáže novou IP');
    typeT('ping 192.168.1.1');
    check(qt('#info [data-frame]'), 'rentgen: zachycené rámce pingu');
    qt('#info [data-frame="0"]').click();
    check(qt('#info .xt') && qt('#info[data-focus]'), 'rentgen: klik na rámec ukáže pole hlaviček (ohnisko rentgen)');
    qt('[data-hint="0"]').click();
    check(dt.querySelectorAll('.thint.open').length === 1 && qt('[data-hint="2"]').disabled, 'nápovědy: první otevřená, třetí zamčená');
    qt('#t-check').click();
    check(qt('.tres.ok') && qt('#tcard[data-focus]'), 'úloha 4: po nastavení funguje');
    check(!dt.documentElement.dataset.errors, `úloha 4 bez chyb (${dt.documentElement.dataset.lastError ?? ''})`);
    waitT = loaded();
    wt.location.hash = '#uloha=1';
    await waitT; await wait(400);
    dt = f.contentDocument; wt = f.contentWindow;
    qt = (s) => dt.querySelector(s);
    check(qt('[data-cable="L1"].off'), 'úloha 1: kabel Alice vytažený');
    qt('[data-cable="L1"]').click();
    check(!qt('[data-cable="L1"].off'), 'úloha 1: klik kabel zapojí');
    qt('#t-check').click();
    check(qt('.tres.ok'), 'úloha 1: po zapojení funguje');
    waitT = loaded();
    wt.location.hash = '#uloha=13&seed=1';
    await waitT; await wait(400);
    dt = f.contentDocument; wt = f.contentWindow;
    qt = (s) => dt.querySelector(s);
    check(qt('#t-layer') && /číslo\s*1/.test(qt('.tseed').textContent), 'úloha 13: seed v zadání, výběr vrstvy');
    qt('#t-check').click();
    check(qt('.tres.fail'), 'úloha 13 seed 1: nefunguje');
    check(!dt.documentElement.dataset.errors, `úlohy bez chyb (${dt.documentElement.dataset.lastError ?? ''})`);
  } catch (e) {
    check(false, `výjimka: ${e}`);
  }
  const out = document.getElementById('result');
  out.textContent = log.join('\n');
  out.dataset.result = failed ? 'FAIL' : 'OK';
};
</script>
